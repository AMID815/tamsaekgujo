<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>테마파인더 — 테마탐색구조대</title>
<link rel="stylesheet" href="style.css?v=39">
<link rel="stylesheet" href="finder.css?v=1">
</head>
<body>
<header class="top">
  <div class="top-l">
    <h1>🔎 테마파인더</h1>
    <span id="meta">인덱스 불러오는 중…</span>
  </div>
  <a class="back-link" href="./">← 대시보드</a>
</header>
<main class="finder-main">
  <div class="sbox">
    <input id="q" type="search" placeholder="종목명 또는 6자리 코드 검색"
           autocomplete="off" autocapitalize="off" spellcheck="false">
    <ul id="suggest" class="suggest hidden"></ul>
  </div>
  <section id="result" class="hidden">
    <div class="rhead">
      <h2 id="rname"></h2>
      <span id="rmeta"></span>
    </div>
    <div id="rchips" class="chips"></div>
    <div id="timeline" class="tl"></div>
  </section>
  <p id="empty" class="empty">종목을 검색하면 그동안 어떤 테마로 분류돼 왔는지
    소스별(네프콘·주도섹터·뉴스·대시보드) 타임라인으로 보여줍니다.</p>
  <p id="err" class="hidden"></p>
</main>
<footer id="cov">테마탐색구조대 수집 데이터 기반 · 투자 판단 참고용</footer>
<script src="finder.js?v=1"></script>
</body>
</html>
