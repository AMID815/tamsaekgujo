<body>
<header class="top">

    <span id="meta">인덱스 불러오는 중…</span>
  </div>
  <a class="back-link" href="./" title="테마탐색구조대 대시보드로 이동">
    <svg class="logo" viewBox="0 0 44 26" width="34" height="20" fill="none" stroke="#e5342b" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="rotor"><path d="M3 6.5Q22 2 41 6.5"/><path d="M6 7 41 5.4"/></g><path d="M21 6.4 22 9.7"/><path d="M4 17 7.2 11 24 9.6Q28 9.4 30 11L41 7.4 41.7 9.1 30.6 13 26.6 16 9 17.6Z"/><g class="trotor"><path d="M40.2 5 42.7 9.2"/></g><path d="M33 10.2 37.2 8.7"/><path d="M8 11.5 11 11M7.6 13.2 9.2 11.3"/><path d="M13 17.4 12.6 20M22 16.9 22 20"/><circle cx="12.5" cy="20.7" r="0.9"/><circle cx="22" cy="20.7" r="0.9"/></svg>

<main class="finder-main">
  <div class="sbox">

           autocomplete="off" autocapitalize="off" spellcheck="false">
    <ul id="suggest" class="suggest hidden"></ul>
  </div>
  <section id="result" class="hidden">
    <div class="rhead">
      <h2 id="rname"></h2>
      <span id="rmeta"></span>
    </div>
    <div id="rchips" class="chips"></div>
    <div id="timeline" class="tl"></div>
  </section>
  <p id="empty" class="empty">종목을 검색하면 그동안 어떤 테마로 분류돼 왔는지
    소스별(네프콘·주도섹터·뉴스·대시보드) 타임라인으로 보여줍니다.</p>
  <p id="err" class="hidden"></p>
</main>
<footer id="cov">테마탐색구조대 수집 데이터 기반 · 투자 판단 참고용</footer>
